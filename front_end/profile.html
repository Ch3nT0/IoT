<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Smart Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="flex min-h-screen bg-slate-50">
    <nav class="w-72 bg-slate-900 h-screen sticky top-0 p-6 flex flex-col text-slate-400 shadow-2xl">
        <div class="mb-10 text-white flex gap-3">
            <div class="p-2 bg-blue-600 rounded-lg"><i class="fas fa-bolt"></i></div>
            <h2 class="text-xl font-bold tracking-tight">SMART HOME</h2>
        </div>
        <div class="space-y-3 flex-grow">
            <a href="index.html" class="flex p-4 hover:bg-slate-800 rounded-xl font-semibold transition-all"><i class="fas fa-th-large mr-3"></i> Dashboard</a>
            <a href="sensor.html" class="flex p-4 hover:bg-slate-800 rounded-xl font-semibold transition-all"><i class="fas fa-database mr-3"></i> Sensor Data</a>
            <a href="history.html" class="flex p-4 hover:bg-slate-800 rounded-xl font-semibold transition-all"><i class="fas fa-running mr-3"></i> Action History</a>
            <a href="profile.html" class="flex p-4 bg-blue-600 text-white rounded-xl font-semibold shadow-lg shadow-blue-900/20 transition-all"><i class="fas fa-user mr-3"></i> Profile</a>
        </div>
        <div class="text-[10px] uppercase tracking-widest text-center opacity-30">Gemini IOT System 2026</div>
    </nav>

    <main class="flex-grow p-10 flex items-center justify-center">
        <div class="max-w-3xl w-full bg-white rounded-[48px] shadow-sm border border-slate-100 p-12 text-center transition-all hover:shadow-xl">
            <div class="relative w-36 h-36 mx-auto mb-8">
                <img src="https://ui-avatars.com/api/?name=Nguyen+An&background=2563eb&color=fff" class="w-full h-full rounded-full border-8 border-slate-50 shadow-inner object-cover">
                <div class="absolute bottom-2 right-2 w-6 h-6 bg-green-500 border-4 border-white rounded-full"></div>
            </div>

            <h2 class="text-3xl font-extrabold text-slate-800 mb-2">Nguyễn Văn A</h2>
            <p class="text-blue-600 font-bold mb-12 uppercase tracking-[0.2em] text-[10px] bg-blue-50 inline-block px-4 py-1 rounded-full">IOT Engineer / Developer</p>
            
            <div class="grid grid-cols-2 gap-6">
                <a href="#" class="group p-8 bg-slate-50 rounded-[32px] hover:bg-slate-900 transition-all duration-300 flex flex-col items-center border border-transparent hover:border-slate-800">
                    <i class="fab fa-github text-4xl mb-3 text-slate-800 group-hover:text-white transition-colors"></i>
                    <span class="text-[11px] font-black uppercase tracking-widest text-slate-500 group-hover:text-slate-400">Github</span>
                </a>

                <a href="#" class="group p-8 bg-slate-50 rounded-[32px] hover:bg-blue-600 transition-all duration-300 flex flex-col items-center border border-transparent hover:border-blue-500">
                    <i class="fas fa-code text-4xl mb-3 text-blue-600 group-hover:text-white transition-colors"></i>
                    <span class="text-[11px] font-black uppercase tracking-widest text-slate-500 group-hover:text-blue-100">API Doc</span>
                </a>

                <a href="#" class="group p-8 bg-slate-50 rounded-[32px] hover:bg-purple-600 transition-all duration-300 flex flex-col items-center border border-transparent hover:border-purple-500">
                    <i class="fab fa-figma text-4xl mb-3 text-purple-600 group-hover:text-white transition-colors"></i>
                    <span class="text-[11px] font-black uppercase tracking-widest text-slate-500 group-hover:text-purple-100">Figma UI</span>
                </a>

                <a href="#" class="group p-8 bg-slate-50 rounded-[32px] hover:bg-red-600 transition-all duration-300 flex flex-col items-center border border-transparent hover:border-red-500">
                    <i class="fas fa-file-pdf text-4xl mb-3 text-red-600 group-hover:text-white transition-colors"></i>
                    <span class="text-[11px] font-black uppercase tracking-widest text-slate-500 group-hover:text-red-100">Báo cáo</span>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
